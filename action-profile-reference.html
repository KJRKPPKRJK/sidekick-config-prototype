<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Action Profile — Parameter Reference | Sidekick</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #f5f7fa; }

    /* Layer colours */
    .fe-border  { border-left: 4px solid #2a8703; }
    .be-border  { border-left: 4px solid #0053e2; }
    .fe-head    { background: #f0fbe8; }
    .be-head    { background: #e8f0fd; }
    .fe-badge   { background: #d4edbd; color: #1a5c02; }
    .be-badge   { background: #ccdcfb; color: #0053e2; }
    .fe-filter-active { background: #2a8703 !important; color: #fff !important; border-color: #2a8703 !important; }
    .be-filter-active { background: #0053e2 !important; color: #fff !important; border-color: #0053e2 !important; }
    .all-filter-active{ background: #004F9A !important; color: #fff !important; border-color: #004F9A !important; }

    .badge { display:inline-flex; align-items:center; padding:2px 9px; border-radius:9999px; font-size:11px; font-weight:600; white-space:nowrap; }
    code.param-key { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; font-weight: 700; color: #004F9A; background: #e8f0fd; padding: 3px 8px; border-radius: 5px; word-break: break-all; }
    .param-row { transition: background 0.12s; }
    .param-row:hover { background: #f0f6ff; }
    .filter-btn { cursor: pointer; transition: all 0.15s; border: 2px solid; border-radius: 9999px; padding: 6px 18px; font-size: 13px; font-weight: 600; background: white; }
    .filter-btn:hover { opacity: 0.85; }

    /* Subtle shimmer on header */
    .header-bar { background: linear-gradient(135deg, #041E42 0%, #004F9A 60%, #0071DC 100%); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 3px; }

    .section-card { border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border: 1px solid #e3e4e5; }
    .empty-state  { text-align: center; padding: 60px 20px; color: #74767C; }
  </style>
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────── -->
  <div class="header-bar text-white px-6 py-6 shadow-xl">
    <div class="max-w-5xl mx-auto">
      <div class="flex items-center gap-3 mb-1">
        <span class="text-3xl">📋</span>
        <h1 class="text-2xl font-bold tracking-tight">Action Profile — Parameter Reference</h1>
      </div>
      <p class="text-blue-300 text-sm mt-1 ml-12">
        Sidekick Docs ·
        <a href="https://docs.stage.sidekick.walmart.com/docs/concepts/action-profile"
           class="underline hover:text-white" target="_blank">
          docs.stage.sidekick.walmart.com/docs/concepts/action-profile
        </a>
      </p>

      <!-- Legend -->
      <div class="flex gap-4 mt-4 ml-12 flex-wrap">
        <div class="flex items-center gap-2 text-sm">
          <span class="inline-block w-3 h-3 rounded-full bg-green-400"></span>
          <span class="text-green-300 font-semibold">Frontend</span>
          <span class="text-blue-200">— controls Sidekick mobile app UI & display</span>
        </div>
        <div class="flex items-center gap-2 text-sm">
          <span class="inline-block w-3 h-3 rounded-full bg-blue-400"></span>
          <span class="text-blue-300 font-semibold">Backend</span>
          <span class="text-blue-200">— data, validation, logic, scheduling, routing</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Controls ───────────────────────────────────────────── -->
  <div class="max-w-5xl mx-auto px-4 pt-6 pb-3">
    <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center">

      <!-- Filter buttons -->
      <div class="flex gap-2 flex-shrink-0">
        <button id="btn-all"      class="filter-btn" onclick="setFilter('all')"      style="border-color:#004F9A; color:#004F9A;">All</button>
        <button id="btn-frontend" class="filter-btn" onclick="setFilter('frontend')" style="border-color:#2a8703; color:#2a8703;">🖼️ Frontend</button>
        <button id="btn-backend"  class="filter-btn" onclick="setFilter('backend')"  style="border-color:#0053e2; color:#0053e2;">⚙️ Backend</button>
      </div>

      <!-- Search -->
      <input id="search" type="text" placeholder="🔍  Search by parameter name, type, or description…"
        oninput="render()"
        class="flex-1 border-2 border-gray-200 rounded-full px-5 py-2 text-sm outline-none focus:border-blue-500 bg-white w-full" />
    </div>

    <!-- Count -->
    <p id="count" class="text-xs text-gray-400 mt-3 font-medium"></p>
  </div>

  <!-- ── Sections ───────────────────────────────────────────── -->
  <div class="max-w-5xl mx-auto px-4 pb-16" id="sections"></div>

  <!-- ── Data + Logic ──────────────────────────────────────── -->
  <script>
  const SECTIONS = [

    // ─── ACTION PROFILE IDENTITY ──────────────────────────────
    {
      id: "ap-identity",
      title: "Action Profile — Identity Attributes",
      icon: "🔑",
      layer: "backend",
      description: "Core identifiers that uniquely describe an Action Profile and scope it to a tenant.",
      params: [
        { key: "id",                type: "string",       req: true,  desc: "Composite unique identifier combining action_profile_id + version. Format: {action_profile_id}_{version}." },
        { key: "action_profile_id", type: "string (uuid)",req: true,  desc: "Stable UUID for the action profile — stays the same across all versions." },
        { key: "version",           type: "integer",      req: true,  desc: "Monotonically increasing version number. Increment whenever the profile definition changes." },
        { key: "tenant_id",         type: "string",       req: true,  desc: "Scopes the profile to a tenant, e.g. WalmartUS. Prevents cross-tenant data bleed." },
        { key: "action_type",       type: "string",       req: true,  desc: "The action type this profile governs, e.g. backroom.scan_and_pick. Used for routing and lookup." },
      ]
    },

    // ─── DEFAULT CONFIGURATIONS ───────────────────────────────
    {
      id: "default-configs",
      title: "Default Configurations",
      icon: "⚙️",
      layer: "backend",
      description: "Fallback values applied to actions when the incoming payload omits those fields.",
      params: [
        { key: "default_configs",                    type: "object",         req: false, desc: "Container object for all default configuration settings." },
        { key: "default_configs.action_expiry",      type: "TimeConfig",     req: false, desc: "Calculates when the action automatically expires. Uses TimeConfig modes." },
        { key: "default_configs.due_date",           type: "TimeConfig",     req: false, desc: "Calculates the action's due date. Uses TimeConfig modes." },
        { key: "default_configs.title",              type: "LocalizedTemplate", req: false, desc: "Default localized title applied to actions when the payload doesn't include one." },
        { key: "default_configs.prioritization",     type: "object",         req: false, desc: "Default prioritization settings — score, rank, weight — when the payload omits them." },
      ]
    },

    // ─── TIMECONFIG ───────────────────────────────────────────
    {
      id: "timeconfig",
      title: "TimeConfig (Nested Helper)",
      icon: "⏱️",
      layer: "backend",
      description: "Reusable object for computing time-based values like expiry and due dates.",
      params: [
        { key: "mode",         type: "string",  req: true,  desc: "Calculation strategy — relative_time (offset from creation) or end_of_day (end of the Nth day)." },
        { key: "days",         type: "integer", req: false, desc: "Number of full days to offset from the reference timestamp." },
        { key: "hours",        type: "integer", req: false, desc: "Additional hours offset on top of the day count." },
        { key: "cutoff_time",  type: "string",  req: false, desc: "Hard cutoff time in HH:MM:SS — e.g. 23:59:59 to cap at end of business day." },
      ]
    },

    // ─── VERTICAL ACTION ID GENERATOR ────────────────────────
    {
      id: "id-generator",
      title: "Vertical Action ID Generator",
      icon: "🔢",
      layer: "backend",
      description: "Controls how unique vertical_action_id values are generated to prevent duplicate actions.",
      params: [
        { key: "vertical_action_id_generator",         type: "object", req: false, desc: "Top-level config for the ID generation strategy." },
        { key: "vertical_action_id_generator.app",     type: "string", req: true,  desc: "Who generates the ID: source_system (caller provides it) or sidekick (platform auto-generates)." },
        { key: "vertical_action_id_generator.fields",  type: "array",  req: false, desc: "List of action fields concatenated to form the ID — used when app = sidekick." },
      ]
    },

    // ─── ACTION PAYLOAD VALIDATIONS ──────────────────────────
    {
      id: "payload-validations",
      title: "Action Payload Validations",
      icon: "✅",
      layer: "backend",
      description: "Rules applied to incoming action payloads before they are accepted into the system.",
      params: [
        { key: "action_payload_validations",                   type: "array",  req: false, desc: "Ordered list of validation rules — all must pass or the payload is rejected." },
        { key: "action_payload_validations[].field_name",      type: "string", req: true,  desc: "JSON dot-path to the field being validated, e.g. locations or prioritization_attributes.vertical_rank." },
        { key: "action_payload_validations[].validator_name",  type: "string", req: true,  desc: "Which validator to invoke — e.g. max_days, location_validator. See Available Validators section." },
        { key: "action_payload_validations[].params",          type: "object", req: false, desc: "Key-value params passed to the validator, e.g. { days: 30 } or { allowed_levels: ['store','aisle'] }." },
      ]
    },

    // ─── AVAILABLE VALIDATORS ────────────────────────────────
    {
      id: "validators",
      title: "Available Validators",
      icon: "🛡️",
      layer: "backend",
      description: "Built-in validators you can reference by name in action_payload_validations.",
      params: [
        { key: "max_days",           type: "validator", req: false, desc: "Checks that a date field is no more than N days in the future. Params: { days: <integer> }." },
        { key: "location_validator", type: "validator", req: false, desc: "Validates the structure and granularity of location data. Params: { allowed_levels: ['store','aisle','shelf',...] }." },
      ]
    },

    // ─── SIDEKICK APP CONFIGURATION ──────────────────────────
    {
      id: "app-config",
      title: "Sidekick App Configuration",
      icon: "📱",
      layer: "frontend",
      description: "Top-level config controlling whether and how this action type appears in the Sidekick mobile app.",
      params: [
        { key: "sidekick_app_config",              type: "object",  req: false, desc: "Root container for all Sidekick mobile UI & behavioural settings." },
        { key: "sidekick_app_config.enabled",      type: "boolean", req: true,  desc: "Master toggle — false hides the action type from the app entirely." },
        { key: "sidekick_app_config.screen_name",  type: "string",  req: false, desc: "Internal screen identifier used for deep-linking, navigation routing, and analytics." },
      ]
    },

    // ─── TEMPLATE CONFIG ─────────────────────────────────────
    {
      id: "template-config",
      title: "Template Config",
      icon: "🎨",
      layer: "frontend",
      description: "Defines which UI card template is rendered for this action type and configures its page-level labels.",
      params: [
        { key: "sidekick_app_config.template_config",                   type: "object",          req: false, desc: "Detailed config for the action card layout in the Sidekick app." },
        { key: "sidekick_app_config.template_config.id",                type: "string",          req: true,  desc: "Template identifier — maps to a pre-built card component, e.g. ai_recommended_action." },
        { key: "sidekick_app_config.template_config.owner",             type: "string",          req: true,  desc: "Owning team or system for this template, e.g. sidekick, backroom." },
        { key: "sidekick_app_config.template_config.page_title",        type: "object",          req: false, desc: "Config for the action detail page's title bar." },
        { key: "sidekick_app_config.template_config.page_title.text",   type: "LocalizedTemplate", req: false, desc: "Locale-keyed strings for the page title (en-US, es-MX…). Supports {$field} substitution." },
      ]
    },

    // ─── SOP TEMPLATE ────────────────────────────────────────
    {
      id: "sop-template",
      title: "SOP Template",
      icon: "📋",
      layer: "frontend",
      description: "Configures how Standard Operating Procedure instructions appear on the action detail screen.",
      params: [
        { key: "sidekick_app_config.sop_template",                              type: "object", req: false, desc: "Container for SOP display config on the action detail screen." },
        { key: "sidekick_app_config.sop_template.step_to_succeed",              type: "object", req: false, desc: "Config for the 'steps to succeed' panel shown to the associate." },
        { key: "sidekick_app_config.sop_template.step_to_succeed.title",        type: "object", req: false, desc: "Localized title + emphasis (e.g. bold) for the steps heading." },
        { key: "sidekick_app_config.sop_template.completion",                   type: "object", req: false, desc: "UI config for what is shown after the associate marks the action complete." },
        { key: "sidekick_app_config.sop_template.completion.title",             type: "object", req: false, desc: "Localized title for the completion confirmation element." },
      ]
    },

    // ─── WIDGETS ─────────────────────────────────────────────
    {
      id: "widgets",
      title: "Widgets",
      icon: "🧩",
      layer: "frontend",
      description: "Additional UI components rendered on the action detail screen, each surfacing a distinct data view.",
      params: [
        { key: "sidekick_app_config.widgets[]",         type: "array",           req: false, desc: "Ordered list of widgets to render on the action detail screen." },
        { key: "sidekick_app_config.widgets[].id",      type: "string",          req: true,  desc: "Widget identifier — maps to a pre-built component, e.g. inventory-status-widget." },
        { key: "sidekick_app_config.widgets[].title",   type: "LocalizedTemplate", req: false, desc: "Locale-keyed title shown as the widget section header." },
        { key: "sidekick_app_config.widgets[].params",  type: "object",          req: false, desc: "Widget-specific parameters, e.g. { show_history: true, max_items: 5 }." },
      ]
    },

    // ─── LOCALIZED TEMPLATE ──────────────────────────────────
    {
      id: "localized-template",
      title: "LocalizedTemplate (Nested Helper)",
      icon: "🌐",
      layer: "frontend",
      description: "Reusable locale-keyed string map with dynamic variable substitution — drives all visible text in the app.",
      params: [
        { key: "<locale> (e.g. en-US)",  type: "string",   req: false, desc: "Template string for the given locale. Supports {$field.path} placeholders for runtime substitution." },
        { key: "{$locations.aisle}",     type: "variable", req: false, desc: "Injects the aisle value from the action's locations array into the displayed string." },
        { key: "{$locations.id}",        type: "variable", req: false, desc: "Injects the location ID into the displayed string." },
        { key: "{$<field_name>}",        type: "variable", req: false, desc: "Generic dot-path accessor — any action field can be substituted into display strings this way." },
      ]
    },

    // ─── ACTION CONFIG IDENTITY ───────────────────────────────
    {
      id: "ac-identity",
      title: "Action Config — Identity (Node-Level)",
      icon: "🏪",
      layer: "backend",
      description: "Identity fields that anchor an Action Config record to a specific node, tenant, and action type.",
      params: [
        { key: "id",           type: "string (uuid)", req: true,  desc: "Unique identifier for this node-level Action Config record." },
        { key: "config_id",    type: "string (uuid)", req: true,  desc: "Configuration identifier — typically the same value as id." },
        { key: "type",         type: "string",        req: true,  desc: "Action type this config governs at the node, e.g. backroom.scan_and_pick." },
        { key: "vertical_id",  type: "string",        req: true,  desc: "Domain/vertical identifier, e.g. backroom, topstock." },
        { key: "tenant_id",    type: "string",        req: true,  desc: "Scopes the config to a tenant, e.g. WalmartUS." },
      ]
    },

    // ─── ACTIVATION TIME ─────────────────────────────────────
    {
      id: "activation-time",
      title: "Activation Time",
      icon: "🕐",
      layer: "backend",
      description: "Defines the daily time window during which actions of this type are surfaced at the node.",
      params: [
        { key: "activation_time",            type: "object", req: false, desc: "Time window config — actions outside this window are hidden from the work queue." },
        { key: "activation_time.start_time", type: "string", req: true,  desc: "Start of the window in HH:MM (24-hour, node's local timezone) — e.g. 09:00." },
        { key: "activation_time.end_time",   type: "string", req: true,  desc: "End of the window in HH:MM (24-hour, node's local timezone) — e.g. 17:00." },
      ]
    },

    // ─── ACTION EVENT CONFIG ──────────────────────────────────
    {
      id: "event-config",
      title: "Action Event Config",
      icon: "⚡",
      layer: "backend",
      description: "Automated triggers that fire backend operations when specific action lifecycle events occur.",
      params: [
        { key: "action_event_config",                      type: "array",  req: false, desc: "List of event→operation mappings. Each entry listens for a lifecycle event and executes operations." },
        { key: "action_event_config[].transaction_type",   type: "string", req: true,  desc: "Lifecycle event to listen for — e.g. COMPLETION, EXPIRY, CANCELLATION." },
        { key: "action_event_config[].operation_type",     type: "string", req: true,  desc: "Operation to perform when the event fires — e.g. COMPLETE, RECREATE, NOTIFY." },
        { key: "action_event_config[].actions",            type: "array",  req: false, desc: "Named actions to execute, e.g. [{ name: 'recreate' }] to auto-recreate on completion." },
      ]
    },

    // ─── TEAM ASSIGNMENT RESOLUTION ───────────────────────────
    {
      id: "team-resolution",
      title: "Team Assignment Resolution Config",
      icon: "👥",
      layer: "backend",
      description: "Determines how the system resolves which team gets assigned to this action type at the node.",
      params: [
        { key: "team_assignment_resolution_config",         type: "object", req: false, desc: "Container for team-resolution strategy at this node." },
        { key: "team_assignment_resolution_config.type",    type: "string", req: true,  desc: "Strategy — static (fixed team list defined here) or dynamic (resolved at runtime from context)." },
        { key: "team_assignment_resolution_config.value",   type: "array",  req: false, desc: "List of team objects { id, name } used when type = static." },
      ]
    },

    // ─── APPLICABLE TEAMS ────────────────────────────────────
    {
      id: "applicable-teams",
      title: "Applicable Teams",
      icon: "👁️",
      layer: "backend",
      description: "Controls which teams can see and claim actions of this type in the Sidekick app.",
      params: [
        { key: "applicable_teams",                  type: "object",  req: false, desc: "Visibility configuration — restricts which teams have access to this action type." },
        { key: "applicable_teams.enable_for_all",   type: "boolean", req: true,  desc: "If true, every team at the node can see the action. If false, only teams in the list below." },
        { key: "applicable_teams.teams",            type: "array",   req: false, desc: "Allowlist of team objects { id, name } when enable_for_all is false." },
      ]
    },

    // ─── ASSIGNMENT CONSTRAINTS ───────────────────────────────
    {
      id: "assignment-constraints",
      title: "Assignment Constraints",
      icon: "🔒",
      layer: "backend",
      description: "Business rules restricting which associates are eligible to be assigned this action type.",
      params: [
        { key: "assignment_constraints",                         type: "object", req: false, desc: "Container for all associate eligibility rules." },
        { key: "assignment_constraints.badging_credentials",     type: "array",  req: false, desc: "Required certifications or badges — e.g. forklift licence. Associates without them are excluded." },
        { key: "assignment_constraints.age_restriction",         type: "array",  req: false, desc: "Age restriction rules, each with min_age, max_age, and optional attribute overrides." },
        { key: "assignment_constraints.associates_required",     type: "object", req: false, desc: "Staffing requirement — { min: <n>, max: <n> } associates needed to complete the action." },
      ]
    },

    // ─── AUTO PRIORITIZATION ─────────────────────────────────
    {
      id: "auto-prioritization",
      title: "Auto Prioritization",
      icon: "🚀",
      layer: "backend",
      description: "Scheduled background job that automatically scores and ranks actions for this type.",
      params: [
        { key: "auto_prioritization",                          type: "object",  req: false, desc: "Container for the auto-prioritization job config." },
        { key: "auto_prioritization.enabled",                  type: "boolean", req: true,  desc: "Master toggle — set false to disable the prioritization job entirely for this type." },
        { key: "auto_prioritization.execution_config",         type: "object",  req: false, desc: "Scheduling config for when the job runs." },
        { key: "auto_prioritization.execution_config.fixed_time", type: "string", req: false, desc: "Daily fixed run time in HH:MM, e.g. 08:00. Job fires once per day at this time." },
        { key: "auto_prioritization.config",                   type: "object",  req: false, desc: "Algorithm config — specversion, prioritization_enabled flag, scoring rules, weights." },
      ]
    },

    // ─── UNASSIGNMENT ─────────────────────────────────────────
    {
      id: "unassignment",
      title: "Unassignment",
      icon: "🔄",
      layer: "backend",
      description: "Scheduled job that automatically un-assigns stale or overdue actions from associates.",
      params: [
        { key: "unassignment",                            type: "object",  req: false, desc: "Container for the auto-unassignment job config." },
        { key: "unassignment.enabled",                    type: "boolean", req: true,  desc: "Master toggle — set false to disable auto-unassignment for this type." },
        { key: "unassignment.execution_config",           type: "object",  req: false, desc: "Scheduling config for when the unassignment job runs." },
        { key: "unassignment.execution_config.fixed_time",type: "string",  req: false, desc: "Daily fixed run time in HH:MM, e.g. 09:00." },
        { key: "unassignment.config",                     type: "object",  req: false, desc: "Unassignment rule config — vertical, action_type, constraint rules, grace period." },
      ]
    },

    // ─── SOP NODE-LEVEL ───────────────────────────────────────
    {
      id: "sop-node",
      title: "SOP — Node-Level Override",
      icon: "📖",
      layer: "frontend",
      description: "Node-specific SOP content that overrides or extends the global SOP template — steps are rendered in the Sidekick app.",
      params: [
        { key: "sop",                           type: "object",          req: false, desc: "Node-level SOP container — overrides the profile-level sop_template for this node." },
        { key: "sop.id",                        type: "string",          req: false, desc: "Unique SOP identifier for this node's version of the procedure." },
        { key: "sop.uri",                       type: "string",          req: false, desc: "URI pointing to external SOP documentation — shown as a reference link in the app." },
        { key: "sop.owner",                     type: "string",          req: false, desc: "Team that owns this SOP — e.g. sidekick, backroom vertical." },
        { key: "sop.completion",                type: "object",          req: false, desc: "Completion display config — display_type and payload for the post-completion screen." },
        { key: "sop.steps[].id",                type: "string",          req: true,  desc: "Unique step identifier within this SOP." },
        { key: "sop.steps[].order",             type: "integer",         req: true,  desc: "1-based sequence number — determines the order steps appear on screen." },
        { key: "sop.steps[].content.text",      type: "LocalizedTemplate", req: true, desc: "Locale-keyed instruction text for this step — supports markdown." },
        { key: "sop.steps[].content.formatting",type: "string",          req: false, desc: "Render format — markdown or plain." },
      ]
    },

  ]; // end SECTIONS

  // ── State ────────────────────────────────────────────────────
  let activeFilter = 'all';

  // ── Filter buttons ───────────────────────────────────────────
  function setFilter(f) {
    activeFilter = f;
    ['all','frontend','backend'].forEach(id => {
      const btn = document.getElementById('btn-' + id);
      btn.classList.remove('all-filter-active','fe-filter-active','be-filter-active');
      btn.style.color = '';
    });
    const cls = f === 'frontend' ? 'fe-filter-active' : f === 'backend' ? 'be-filter-active' : 'all-filter-active';
    document.getElementById('btn-' + f).classList.add(cls);
    render();
  }

  // ── Render ───────────────────────────────────────────────────
  function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const container = document.getElementById('sections');
    container.innerHTML = '';
    let totalParams = 0;

    SECTIONS.forEach(section => {
      if (activeFilter !== 'all' && section.layer !== activeFilter) return;

      const filtered = section.params.filter(p =>
        !q ||
        p.key.toLowerCase().includes(q) ||
        p.type.toLowerCase().includes(q) ||
        p.desc.toLowerCase().includes(q)
      );
      if (filtered.length === 0) return;
      totalParams += filtered.length;

      const isFE = section.layer === 'frontend';
      const borderCls  = isFE ? 'fe-border'  : 'be-border';
      const headCls    = isFE ? 'fe-head'    : 'be-head';
      const badgeCls   = isFE ? 'fe-badge'   : 'be-badge';
      const layerLabel = isFE ? '🖼️ Frontend' : '⚙️ Backend';

      const rowsHTML = filtered.map(p => `
        <div class="param-row flex flex-col sm:flex-row sm:items-start gap-3 px-4 py-3 border-t border-gray-100">

          <!-- Key -->
          <div class="flex-shrink-0 sm:w-64">
            <code class="param-key">${escHtml(p.key)}</code>
          </div>

          <!-- Type + Required -->
          <div class="flex gap-2 flex-shrink-0 flex-wrap">
            <span class="badge" style="background:#f1f1f2;color:#515357;">${escHtml(p.type)}</span>
            ${p.req
              ? '<span class="badge" style="background:#fce8e9;color:#9b1419;">Required</span>'
              : '<span class="badge" style="background:#f1f1f2;color:#74767c;">Optional</span>'}
          </div>

          <!-- Description -->
          <p class="text-sm text-gray-700 flex-1 leading-relaxed">${escHtml(p.desc)}</p>
        </div>
      `).join('');

      const card = document.createElement('div');
      card.className = `section-card mb-5 ${borderCls}`;
      card.innerHTML = `
        <!-- Section header -->
        <div class="${headCls} px-4 py-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xl">${section.icon}</span>
              <span class="font-bold text-gray-800">${escHtml(section.title)}</span>
              <span class="badge ${badgeCls}">${layerLabel}</span>
            </div>
            <p class="text-xs text-gray-500 mt-1 ml-8">${escHtml(section.description)}</p>
          </div>
          <span class="text-xs text-gray-400 font-mono flex-shrink-0">${filtered.length} param${filtered.length !== 1 ? 's' : ''}</span>
        </div>

        <!-- Column headers -->
        <div class="hidden sm:flex gap-3 px-4 py-2 bg-gray-50 border-t border-gray-100 text-xs font-semibold text-gray-400 uppercase tracking-wide">
          <div class="w-64 flex-shrink-0">Parameter</div>
          <div class="w-36 flex-shrink-0">Type / Required</div>
          <div class="flex-1">Description</div>
        </div>

        <!-- Rows -->
        ${rowsHTML}
      `;
      container.appendChild(card);
    });

    // Empty state
    if (totalParams === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="text-5xl mb-4">🐾</div>
          <p class="text-lg font-semibold text-gray-500">No parameters match your search.</p>
          <p class="text-sm mt-1">Try a different keyword or clear the filter.</p>
        </div>`;
    }

    document.getElementById('count').textContent =
      `Showing ${totalParams} parameter${totalParams !== 1 ? 's' : ''} across ${
        SECTIONS.filter(s => activeFilter === 'all' || s.layer === activeFilter).length
      } section${SECTIONS.filter(s => activeFilter === 'all' || s.layer === activeFilter).length !== 1 ? 's' : ''}`;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // ── Boot ─────────────────────────────────────────────────────
  setFilter('all');
  </script>
</body>
</html>
